[bind]
address = "0.0.0.0"
port = 25565

[backend]
upstreams = ["backend:25566"]

[workers]
count = 4

[limits]
handshake_timeout_secs = 5
max_connections_per_ip = 10
rate_limit_pps = 50.0
rate_limit_burst = 100.0

[store]
redis_url = ""
blacklist_cache_ttl_secs = 300
clickhouse_url = "http://clickhouse:8123"

[xdp]
enabled = false
interface = "eth0"

[metrics]
enabled = true
port = 9090

[logging]
level = "debug"
format = "text"

[pow]
enabled = false
difficulty = 4

whitelist = ["127.0.0.1", "::1"]
