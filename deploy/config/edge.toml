# Rampart edge для Minecraft Java (схема: src/config/sections/)
# whitelist — корневое поле, поэтому оно задаётся до любых TOML-секций.
whitelist = ["127.0.0.1", "::1"]

[bind]
address = "0.0.0.0"
port = 25565

[backend]
# Адрес Paper за доверенным прокси; закрой этот порт firewall-ом от интернета.
upstreams = ["127.0.0.1:25566"]

[protocol.minecraft]
enabled = true
max_frame_bytes = 8192
timeout_secs = 5
# Outbound: включай вместе с proxies.proxy-protocol: true на Paper и firewall,
# разрешающим backend-порт только от этого Rampart.
send_proxy_protocol = false

[workers]
count = 4

[limits]
handshake_timeout_secs = 5
max_connections_per_ip = 10
rate_limit_pps = 5.0
rate_limit_burst = 10.0

[ban]
ban_duration_secs = 3600

[store]
redis_url = ""
blacklist_cache_ttl_secs = 300
clickhouse_url = ""

[xdp]
enabled = false
interface = "eth0"

[logging]
level = "info"
format = "text"

[metrics]
enabled = true
port = 9090

[pow]
enabled = false
difficulty = 4

# Inbound: включай только если входящий TCP-прокси передаёт PROXY v2.
# Укажи точные адреса/CIDR этого прокси; не добавляй сюда адреса игроков.
[proxy_protocol]
ingress_enabled = false
trusted_cidrs = []
ingress_timeout_ms = 750
max_header_bytes = 512
