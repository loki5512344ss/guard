# Rampart edge — единый конфиг (схема: src/config/sections.rs)

[bind]
address = "0.0.0.0"
port = 25565

[backend]
# Generic TCP-бэкенды за edge-нодой (addr:port)
upstreams = ["127.0.0.1:25566"]

[workers]
count = 4

[limits]
handshake_timeout_secs = 5
max_connections_per_ip = 10
rate_limit_pps = 5.0
rate_limit_burst = 10.0

[ban]
ban_duration_secs = 3600

[store]
redis_url = ""
blacklist_cache_ttl_secs = 300
clickhouse_url = ""

[xdp]
enabled = false
interface = "eth0"

[logging]
level = "info"
format = "text"

[metrics]
enabled = true
port = 9090

[pow]
enabled = false
difficulty = 4

whitelist = ["127.0.0.1", "::1"]
