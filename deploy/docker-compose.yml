services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 1s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rampart-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rampart-grafana
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_started
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped

  edge:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.edge
    ports:
      - "25565:25565"
      - "9090:9090"
    environment:
      RAMPART_CONFIG: /etc/rampart/config.toml
    volumes:
      - ./config/edge.toml:/etc/rampart/config.toml:ro
    depends_on:
      redis:
        condition: service_healthy
