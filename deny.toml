[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# rustls-only крипта: не даём тянуть OpenSSL в дерево зависимостей
deny = [
    { name = "openssl-sys", version = "*" },
    { name = "openssl", version = "*" },
]
# Дубли версий допустимы, когда их тянут несовместимые деревья зависимостей
# (redis/jsonwebtoken vs reqwest/axum). Каждая запись — конкретная пара версий.
skip = [
    { name = "base64", version = "0.22" },
    { name = "hashbrown", version = "0.14" },
    { name = "linux-raw-sys", version = "0.4" },
    { name = "num-bigint", version = "0.4" },
    { name = "rustix", version = "0.38" },
    { name = "syn", version = "2" },
    { name = "thiserror", version = "1" },
    { name = "thiserror-impl", version = "1" },
    { name = "tower-http", version = "0.6" },
    { name = "untrusted", version = "0.7" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
